<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.receipts</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <header>
        <h1>.receipts</h1>
        <p>Your personal receipt management system</p>
    </header>

    <main>
        <h2>Welcome to .receipts</h2>
        <p>Manage your receipts in one place.</p>

        <section class="database-card">
            <h2>Database Connection</h2>

            <p>
                Click the button below to test the
                connection between the frontend,
                FastAPI and MySQL database.
            </p>

            <button id="testButton">
                Test Database Connection
            </button>

            <div id="result">
                Database response will appear here.
            </div>

        </section>
    </main>
    <script src="/static/script.js"></script>
</body>
</html>
